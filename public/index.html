<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No Mercy! Trivia</title><style>body{font-family:system-ui;background:radial-gradient(circle at top,#482975,#100e22);color:white;margin:0;min-height:100vh}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:clamp(2rem,6vw,4rem)}.panel{background:#ffffff15;border:1px solid #ffffff30;border-radius:22px;padding:25px;margin:16px 0}button,input{font:inherit;padding:15px;border-radius:12px;border:0;margin:5px}button{cursor:pointer;background:#ffcb48;color:#1a1430;font-weight:800}input{width:170px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:100px;color:white;text-align:left;font-size:1.15rem}.option:nth-child(1){background:#c53e62}.option:nth-child(2){background:#2c68bd}.option:nth-child(3){background:#9c7215}.option:nth-child(4){background:#16836b}.selected{outline:5px solid white}.correct{outline:5px solid #aaffb3}.wrong{opacity:.45}#qr{width:220px;background:white;border-radius:12px}#board div{padding:10px;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between}small{color:#c6c1d5}.hide{display:none}#clock{font-size:3.2rem;font-weight:900}@media(max-width:600px){.grid{grid-template-columns:1fr}.option{min-height:65px}}</style><main><h1>🔥 No Mercy! Trivia Night</h1><p>40 questions • 5 rounds • 60 seconds each • Live leaderboard</p><section id="entry" class="panel"><button id="host">🎬 Host on TV</button><p>Or join your friends:</p><input id="code" placeholder="Room code"><input id="name" placeholder="Nickname" maxlength="24"><button id="join">Join game</button><p id="err"></p></section><section id="game" class="panel hide"><h2 id="phase">Waiting for players…</h2><p id="category"></p><div id="lobby"><p>Scan this QR code to join:</p><img id="qr" alt="Join QR code"><p id="joinurl"></p><button id="start">Start game</button></div><div id="quiz" class="hide"><div id="clock">60</div><h2 id="question"></h2><div id="choices" class="grid"></div><p id="feedback"></p><button id="next" class="hide">Next question →</button></div><h3>🏆 Leaderboard</h3><div id="board"></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id),params=new URLSearchParams(location.search);if(params.get('room'))$('code').value=params.get('room');let host=false,playerId='',room='',selected=-1,st=null;
function error(x){$('err').textContent=x}function joined(){ $('entry').classList.add('hide');$('game').classList.remove('hide')}
$('host').onclick=()=>s.emit('create',{},r=>{if(!r?.ok)return error('Unable to create room');host=true;room=r.code;joined();});
$('join').onclick=()=>s.emit('join',{code:$('code').value,name:$('name').value,playerId:sessionStorage.getItem('playerId')},r=>{if(!r?.ok)return error(r?.error||'Unable to join');room=r.code;playerId=r.playerId;sessionStorage.setItem('playerId',playerId);joined()});
$('start').onclick=()=>s.emit('start',{},()=>{});$('next').onclick=()=>s.emit('next',{},()=>{});
function render(){if(!st)return;let q=st,phase=q.phase;$('phase').textContent=phase==='lobby'?'Room '+q.code+' • Waiting for friends':phase==='question'?'Question '+(q.index+1)+' / '+q.total:phase==='reveal'?'✅ Answer revealed':'🏆 Game over!';$('lobby').classList.toggle('hide',phase!=='lobby');$('quiz').classList.toggle('hide',phase==='lobby'||phase==='finished');$('start').classList.toggle('hide',!host);$('next').classList.toggle('hide',!host||phase!=='reveal');$('category').textContent=q.category||'';if(q.question){$('question').textContent=q.question;$('choices').innerHTML='';q.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='option'+(phase==='reveal'?(i===q.correct?' correct':' wrong'):(i===selected?' selected':''));b.textContent='ABCD'[i]+'. '+opt;b.disabled=host||phase!=='question'||selected>=0;b.onclick=()=>s.emit('answer',{choice:i},r=>{if(r?.ok){selected=i;render()}});$('choices').append(b)});$('feedback').textContent=phase==='reveal'?'Correct answer: '+q.options[q.correct]:(selected>=0?'Answer locked!':(host?q.answersCount+' players answered':'Choose your answer'))} $('board').innerHTML='';[...q.players].sort((a,b)=>b.score-a.score).forEach((p,i)=>{let d=document.createElement('div');let n=document.createElement('span');n.textContent=(i+1)+'. '+p.name+(p.answered?' ✓':'');let v=document.createElement('strong');v.textContent=p.score+' pts';d.append(n,v);$('board').append(d)})}
s.on('state',q=>{if(q.code!==room)return;if(!st||q.index!==st.index)selected=-1;st=q;render();if(host&&q.phase==='lobby'){let url=location.origin+location.pathname+'?room='+q.code;$('joinurl').textContent=url;s.emit('qr',{url},r=>{if(r?.data)$('qr').src=r.data})}});
setInterval(()=>{if(st?.phase==='question')$('clock').textContent=Math.max(0,Math.ceil((st.deadline-Date.now())/1000));else if(st?.phase==='reveal')$('clock').textContent='⏰'},200);
</script></html>
