<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدّي المعلومات والستايل والتكنولوجيا</title><style>body{font-family:system-ui;background:radial-gradient(circle at top,#482975,#100e22);color:white;margin:0;min-height:100vh}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:clamp(2rem,6vw,4rem)}.panel{background:#ffffff15;border:1px solid #ffffff30;border-radius:22px;padding:25px;margin:16px 0}button,input{font:inherit;padding:15px;border-radius:12px;border:0;margin:5px}button{cursor:pointer;background:#ffcb48;color:#1a1430;font-weight:800}input{width:170px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.option{min-height:100px;color:white;text-align:left;font-size:1.15rem}.option:nth-child(1){background:#c53e62}.option:nth-child(2){background:#2c68bd}.option:nth-child(3){background:#9c7215}.option:nth-child(4){background:#16836b}.selected{outline:5px solid white}.correct{outline:5px solid #aaffb3}.wrong{opacity:.45}#qr{width:220px;background:white;border-radius:12px}#board div{padding:10px;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between}small{color:#c6c1d5}.hide{display:none}#clock{font-size:3.2rem;font-weight:900}@media(max-width:600px){.grid{grid-template-columns:1fr}.option{min-height:65px}}</style><main><h1>📺 تحدّي المعلومات والستايل والتكنولوجيا</h1><p>٢٠ سؤال عشوائي من بنك ٦٠ سؤال • ٥ فئات • أسئلة مصوّرة • ٦٠ ثانية كحد أقصى</p><section id="entry" class="panel"><button id="host">🎬 افتح اللعبة على التلفزيون</button><p>أو انضم للعبة:</p><input id="code" placeholder="رمز الغرفة"><input id="name" placeholder="اسم اللاعب" maxlength="24"><button id="join">انضم للعبة</button><p id="err"></p></section><section id="game" class="panel hide"><h2 id="phase">بانتظار اللاعبين…</h2><p id="category"></p><div id="lobby"><p>امسح رمز QR للانضمام:</p><img id="qr" alt="Join QR code"><p id="joinurl"></p><button id="start">ابدأ اللعبة</button></div><div id="quiz" class="hide"><div id="clock">60</div><h2 id="question"></h2><div id="visual" class="hide" role="img" aria-label="تلميح مصور" style="font-size:clamp(5rem,15vw,9rem);text-align:center;background:#ffffff13;border-radius:20px;padding:12px;margin:15px auto;max-width:300px"></div><div id="choices" class="grid"></div><p id="feedback"></p><button id="restart" class="hide">🔄 إعادة اللعبة من البداية</button><button id="next" class="hide">التالي تلقائياً</button></div><h3>🏆 ترتيب اللاعبين</h3><div id="board"></div></section></main><script src="/socket.io/socket.io.js"></script><script>
const s=io(),$=id=>document.getElementById(id),params=new URLSearchParams(location.search);if(params.get('room'))$('code').value=params.get('room');let host=false,playerId='',room='',selected=-1,st=null,answerPending=false;
function error(x){$('err').textContent=x}function joined(){ $('entry').classList.add('hide');$('game').classList.remove('hide')}
$('host').onclick=()=>s.emit('create',{},r=>{if(!r?.ok)return error('Unable to create room');host=true;room=r.code;joined();});
$('join').onclick=()=>s.emit('join',{code:$('code').value,name:$('name').value,playerId:sessionStorage.getItem('playerId')},r=>{if(!r?.ok)return error(r?.error||'Unable to join');room=r.code;playerId=r.playerId;sessionStorage.setItem('playerId',playerId);joined()});
$('restart').onclick=()=>{if(confirm('إعادة اللعبة وتصفير جميع النقاط؟'))s.emit('restart',{},()=>{})};$('start').onclick=()=>s.emit('start',{},()=>{});$('next').onclick=()=>s.emit('next',{},()=>{});
function render(){if(!st)return;let q=st,phase=q.phase;$('phase').textContent=phase==='lobby'?'الغرفة '+q.code+' • بانتظار اللاعبين':phase==='question'?'السؤال '+(q.index+1)+' من '+q.total:phase==='reveal'?'✅ الإجابة الصحيحة — السؤال التالي بعد ٤ ثوانٍ':'🏆 انتهت اللعبة!';$('lobby').classList.toggle('hide',phase!=='lobby');$('quiz').classList.toggle('hide',phase==='lobby'||phase==='finished');$('start').classList.toggle('hide',!host);$('restart').classList.toggle('hide',!host);$('next').classList.add('hide');$('category').textContent=q.category||'';if(q.question){$('question').textContent=q.question;$('visual').classList.toggle('hide',!q.visual);$('visual').textContent=q.visual||'';$('choices').innerHTML='';q.options.forEach((opt,i)=>{let b=document.createElement('button');b.className='option'+(phase==='reveal'?(i===q.correct?' correct':' wrong'):(i===selected?' selected':''));b.textContent='ABCD'[i]+'. '+opt;b.disabled=host||phase!=='question'||selected>=0||answerPending;b.onclick=()=>{if(answerPending)return;answerPending=true;s.emit('answer',{choice:i},r=>{answerPending=false;if(r?.ok){selected=i;render()}else if(st?.phase==='question')render()})};$('choices').append(b)});$('feedback').textContent=phase==='reveal'?'الإجابة الصحيحة: '+q.options[q.correct]:(selected>=0?'تم تثبيت إجابتك!':(host?q.answersCount+' لاعب أجاب':'اختر إجابتك — التالي تلقائياً بعد إجابة الجميع'))} $('board').innerHTML='';[...q.players].sort((a,b)=>b.score-a.score).forEach((p,i)=>{let d=document.createElement('div');let n=document.createElement('span');n.textContent=(i+1)+'. '+p.name+(p.answered?' ✓':'');let v=document.createElement('strong');v.textContent=p.score+' نقطة';d.append(n,v);$('board').append(d)})}
s.on('state',q=>{if(q.code!==room)return;if(!st||q.index!==st.index){selected=-1;answerPending=false}st=q;render();if(host&&q.phase==='lobby'){let url=location.origin+location.pathname+'?room='+q.code;$('joinurl').textContent=url;s.emit('qr',{url},r=>{if(r?.data)$('qr').src=r.data})}});
setInterval(()=>{if(st?.phase==='question')$('clock').textContent=Math.max(0,Math.ceil((st.deadline-Date.now())/1000));else if(st?.phase==='reveal')$('clock').textContent='⏰'},200);
</script></html>
